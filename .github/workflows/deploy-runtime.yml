name: Deploy Company Runtime

# 企業ごとの Runtime（Execution Plane）のデプロイ。
# - main への push: Runtime のイメージを staging の ECR に push し、staging のテナントに適用
# - 手動実行: ステージとテナントを選んで適用（production は GitHub Environment の承認ルールで保護する）
#
# テナントは infra/company/<slug>/<stage>/ を自動で見つける。
# 各テナントは GitHub Environment company-<slug>-<stage> の変数（AWS_DEPLOY_ROLE_ARN など）で、そのテナントのアカウントに適用する。
on:
  push:
    branches: [main]
    paths:
      - "packages/contracts/**"
      - "runtime/**"
      - "infra/company/**"
      - "infra/modules/tenant-runtime/**"
      - "infra/modules/network/**"
      - "infra/modules/ecs-execution-role/**"
      - "yarn.lock"
      - ".github/workflows/deploy-runtime.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: ステージ
        type: choice
        options: [staging, production]
        default: staging
      tenant:
        description: テナントの slug（all ならすべて）
        type: string
        default: all

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-runtime-${{ github.event.inputs.stage || 'staging' }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event.inputs.stage || 'staging' }}
  TERRAFORM_VERSION: "1.15.8"

jobs:
  images:
    name: Runtime のイメージ（${{ matrix.image.name }}）
    runs-on: ubuntu-24.04
    environment: agent-studio-${{ github.event.inputs.stage || 'staging' }}
    env:
      # シークレットを参照したジョブでは、その値（とそれを含む ARN など）がログで *** になる
      AS_LOG_MASK_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    strategy:
      matrix:
        image:
          - { name: runtime-controller, dockerfile: runtime/controller/Dockerfile }
          - { name: tool-gateway, dockerfile: runtime/tool-gateway/Dockerfile }
          - { name: session-worker, dockerfile: runtime/session-worker/Dockerfile }
          - { name: browser-worker, dockerfile: runtime/browser-session-worker/Dockerfile }
          - { name: egress-proxy, dockerfile: runtime/egress-proxy/Dockerfile }
          - { name: demo-internal-api, dockerfile: runtime/demo-internal-api/Dockerfile }
    steps:
      - name: AWS の設定を確認
        id: configured
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "::notice::GitHub Environment agent-studio-${STAGE} に AWS の設定がないため、スキップします"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.configured.outputs.ok == 'true'
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.configured.outputs.ok == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.configured.outputs.ok == 'true'
        id: ecr
      - uses: docker/setup-buildx-action@v4
        if: steps.configured.outputs.ok == 'true'
      - uses: docker/build-push-action@v7
        if: steps.configured.outputs.ok == 'true'
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/agent-studio/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=deploy-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=deploy-${{ matrix.image.name }}

  tenants:
    name: 対象テナントの一覧
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          set -euo pipefail
          TENANT="${{ github.event.inputs.tenant || 'all' }}"
          slugs=()
          for dir in infra/company/*/"${STAGE}"/; do
            [ -d "$dir" ] || continue
            slug=$(basename "$(dirname "$dir")")
            if [ "$TENANT" = "all" ] || [ "$TENANT" = "$slug" ]; then slugs+=("$slug"); fi
          done
          if [ ${#slugs[@]} -eq 0 ]; then echo "matrix=[]" >> "$GITHUB_OUTPUT"; exit 0; fi
          printf '%s\n' "${slugs[@]}" | jq -R . | jq -cs . | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ matrix.slug }}（${{ github.event.inputs.stage || 'staging' }}）
    runs-on: ubuntu-24.04
    needs: [images, tenants]
    if: needs.tenants.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        slug: ${{ fromJson(needs.tenants.outputs.matrix) }}
    environment: company-${{ matrix.slug }}-${{ github.event.inputs.stage || 'staging' }}
    env:
      ROOT: infra/company/${{ matrix.slug }}/${{ github.event.inputs.stage || 'staging' }}
      AS_LOG_MASK_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AS_LOG_MASK_IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      AS_LOG_MASK_AGENT_STUDIO_URL: ${{ secrets.AGENT_STUDIO_URL }}
    steps:
      - name: AWS の設定を確認
        id: configured
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || [ -z "${{ secrets.IMAGE_REGISTRY }}" ]; then
            echo "::notice::GitHub Environment company-${{ matrix.slug }}-${STAGE} に AWS_DEPLOY_ROLE_ARN / IMAGE_REGISTRY がないため、スキップします"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.configured.outputs.ok == 'true'
      - uses: hashicorp/setup-terraform@v4
        if: steps.configured.outputs.ok == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.configured.outputs.ok == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform init
        if: steps.configured.outputs.ok == 'true'
        run: |
          terraform -chdir="$ROOT" init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=company/${{ matrix.slug }}/${STAGE}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Terraform apply
        if: steps.configured.outputs.ok == 'true'
        run: |
          terraform -chdir="$ROOT" apply -input=false -auto-approve \
            -var="image_registry=${{ secrets.IMAGE_REGISTRY }}" \
            -var="agent_studio_url=${{ secrets.AGENT_STUDIO_URL }}" \
            -var="image_tag=${{ github.sha }}"
      - name: Runtime の安定を待つ
        if: steps.configured.outputs.ok == 'true'
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "$(terraform -chdir="$ROOT" output -raw cluster_name)" \
            --services "$(terraform -chdir="$ROOT" output -raw runtime_core_service_name)"
      - name: 次の手順
        if: steps.configured.outputs.ok == 'true'
        run: |
          {
            echo "### ${{ matrix.slug }}（${STAGE}）"
            echo '```'
            terraform -chdir="$ROOT" output -raw next_steps
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
