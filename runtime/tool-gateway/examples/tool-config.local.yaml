# ローカル開発用の Tool Gateway のツール設定（TOOL_CONFIG_PATH に指定する）。
# 本番では infra/company/<tenant>/config.yaml の runtime.tools が SSM パラメータ /<prefix>/tool-config に入る。
# 形式は packages/contracts/src/runtime-config.ts の RuntimeToolConfig。
#
# 接続先は手元で動かす demo-internal-api（http://localhost:8090）。
# 認証情報は CONNECTION_SECRETS_SOURCE=env のとき、環境変数 CONNECTION_SECRET_DEMO_INTERNAL_API から読む
# （値は demo-internal-api の DEMO_API_TOKEN と同じにする）。
version: 1

tools:
  - name: list_products
    description: "商品の一覧（商品 ID・商品名・現在の価格・在庫数）を取得します。"
    risk: read
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    http:
      method: GET
      url: "http://localhost:8090/products"
      auth: { type: bearer, secret: demo-internal-api }
      timeout_ms: 5000

  - name: get_product
    description: "商品 ID を指定して、商品名・現在の価格・在庫数を取得します。"
    risk: read
    input_schema:
      type: object
      properties:
        product_id: { type: string, description: "商品 ID（例: P-001）" }
      required: [product_id]
      additionalProperties: false
    http:
      method: GET
      url: "http://localhost:8090/products/{product_id}"
      auth: { type: bearer, secret: demo-internal-api }
      timeout_ms: 5000

  - name: update_price
    description: "商品の価格を変更します。price_change に変更額（円）を指定します。値下げはマイナスです。"
    risk: financial
    input_schema:
      type: object
      properties:
        product_id: { type: string, description: "商品 ID（例: P-001）" }
        price_change: { type: number, description: "価格の変更額（円）。値上げはプラス、値下げはマイナス" }
      required: [product_id, price_change]
      additionalProperties: false
    http:
      method: POST
      url: "http://localhost:8090/products/{product_id}/price"
      auth: { type: bearer, secret: demo-internal-api }
      timeout_ms: 5000
    # Runtime 側（顧客が管理）の制限。Agent Studio の設定に関係なく適用される
    policies:
      - type: deny
        tool: update_price
        when: { field: price_change, op: ">", value: 10000, abs: true }
        reason: "1 回の価格変更は ±10,000 円までです（Runtime 側の制限）"

  # --- ファクタリング審査シナリオ（demo-factoring-api / factoring_demo DB） ---
  # 認証情報は CONNECTION_SECRET_FACTORING_DEMO_API から読む（値は FACTORING_API_TOKEN と同じにする）。
  - name: list_applications
    description: "審査待ちの買取申込の一覧（申込 ID・申込者・売掛先・請求額・支払期日）を取得します。"
    risk: read
    input_schema:
      type: object
      properties:
        status: { type: string, description: "申込中 / 買取済 / 取下げ。省略時は申込中" }
      additionalProperties: false
    http:
      method: GET
      url: "http://localhost:8091/applications"
      auth: { type: bearer, secret: factoring-demo-api }
      timeout_ms: 5000

  - name: get_application
    description: "買取申込 1 件の審査材料（申込者、売掛先、請求書、入金実績、重複申込、過去審査、社内DBの過去問い合わせ・否決フラグ）を取得します。"
    risk: read
    input_schema:
      type: object
      properties:
        invoice_id: { type: string, description: "申込 ID（例: INV-2026-0101）" }
      required: [invoice_id]
      additionalProperties: false
    http:
      method: GET
      url: "http://localhost:8091/applications/{invoice_id}"
      auth: { type: bearer, secret: factoring-demo-api }
      timeout_ms: 5000

  - name: lookup_internal_history
    description: "会社が用意した社内APIを申込者IDで照会し、最小化済みの過去問い合わせ・社内否決フラグを取得します。"
    risk: read
    input_schema:
      type: object
      properties:
        applicant_id: { type: string, description: "申込者 ID（例: A-001）" }
      required: [applicant_id]
      additionalProperties: false
    http:
      method: GET
      url: "http://localhost:8091/internal-history/{applicant_id}"
      auth: { type: bearer, secret: factoring-demo-api }
      timeout_ms: 5000
      output_schema:
        type: object
        required: [applicant_id, past_inquiry, internal_denied, inquiry_count, active_risk_flag_count, risk_reason_codes, source]
        properties:
          applicant_id: { type: string }
          past_inquiry: { type: boolean }
          internal_denied: { type: boolean }
          inquiry_count: { type: integer }
          active_risk_flag_count: { type: integer }
          risk_reason_codes: { type: array, items: { type: string } }
          source: { type: string }
      response_boundary:
        allowed_fields: [applicant_id, past_inquiry, internal_denied, inquiry_count, active_risk_flag_count, risk_reason_codes, source]
        max_bytes: 65536
        max_records: 1

  - name: list_counterparty_payments
    description: "売掛先ごとの入金実績を、申込をまたいで取得します。支払いの遅れ方を見るのに使います。"
    risk: read
    input_schema:
      type: object
      properties:
        counterparty_id: { type: string, description: "売掛先 ID（例: C-001）" }
      required: [counterparty_id]
      additionalProperties: false
    http:
      method: GET
      url: "http://localhost:8091/counterparties/{counterparty_id}/payments"
      auth: { type: bearer, secret: factoring-demo-api }
      timeout_ms: 5000

  - name: record_screening
    description: "審査結果を基幹システムに記録します。判定と理由は必須、掛目と手数料率は 0〜1 の割合で指定します。"
    risk: financial
    input_schema:
      type: object
      properties:
        invoice_id: { type: string, description: "申込 ID" }
        decision: { type: string, enum: ["可", "否", "保留"], description: "買取の判定" }
        reason: { type: string, description: "その判定にした理由（根拠にした事実を含める）" }
        advance_rate: { type: number, description: "掛目。0.85 なら請求額の 85%" }
        fee_rate: { type: number, description: "手数料率。0.03 なら 3%" }
        verified_corporate_number: { type: string, description: "実在確認で確認できた売掛先の法人番号（13 桁）" }
        idempotency_key: { type: string, description: "Workflow Runと書き戻しStepから作る一意キー" }
      required: [invoice_id, decision, reason, idempotency_key]
      additionalProperties: false
    http:
      method: POST
      url: "http://localhost:8091/screenings"
      auth: { type: bearer, secret: factoring-demo-api }
      timeout_ms: 5000

  - name: analyze_bank_statement
    description: "顧客Runtime内で通帳PDFを解析し、月別金額・名義一致・継続月数だけを返します。生PDFと本文は外へ出しません。"
    risk: read
    input_schema:
      type: object
      properties:
        file_id: { type: string, description: "Runtime内ファイルID" }
      required: [file_id]
      additionalProperties: false
    http:
      method: POST
      url: "http://localhost:8091/documents/analyze"
      auth: { type: bearer, secret: factoring-demo-api }
      timeout_ms: 10000

  - name: check_compliance
    description: "許可済みの架空コンプライアンス一覧を法人番号で照合し、clear / hitだけを返します。実在人物・実在企業の反社判定には使いません。"
    risk: read
    input_schema:
      type: object
      properties:
        corporate_number: { type: string, description: "架空データの法人番号（13桁）" }
      required: [corporate_number]
      additionalProperties: false
    http:
      method: GET
      url: "http://localhost:8091/compliance/{corporate_number}"
      auth: { type: bearer, secret: factoring-demo-api }
      timeout_ms: 5000

  - name: evaluate_factoring_rules
    description: "希望額・過去問い合わせ・重複・コンプライアンス・入金集計から、決定的ルールで可・否・保留候補を返します。"
    risk: read
    input_schema:
      type: object
      properties:
        requested_amount: { type: number }
        past_inquiry: { type: boolean }
        duplicate_invoice: { type: boolean }
        internal_denied: { type: boolean }
        compliance_status: { type: string, enum: [clear, hit, unavailable] }
        corporate_verified: { type: boolean }
        payment_summary: { type: object }
        application: { type: object, description: "get_applicationの構造化結果。指定時は過去審査と重複請求書をRuntime内で判定" }
        compliance: { type: object, description: "コンプライアンスToolの構造化結果" }
      required: [requested_amount, corporate_verified, payment_summary]
      additionalProperties: false
    http:
      method: POST
      url: "http://localhost:8091/decisions/evaluate"
      auth: { type: bearer, secret: factoring-demo-api }
      timeout_ms: 5000

# Browser（runtime/browser-session-worker）。Run ごとに Controller が起動した Worker へ中継する。
# dynamic_session_endpoint: browser のとき url は使わず、Session Grant の browser.endpoint へ繋ぐ。
# Run の前に一覧を取りに行けないため、description と input_schema はここで固定する
# （runtime/browser-session-worker/src/actions.ts の BROWSER_TOOLS と合わせること）。
upstream_mcp:
  - name: browser
    url: "http://127.0.0.1:8931/mcp"
    dynamic_session_endpoint: browser
    tools:
      - name: browser_navigate
        risk: read
        reads_untrusted_content: true
        description: "許可されたURLを開きます"
        input_schema:
          type: object
          properties:
            url: { type: string }
          required: [url]
          additionalProperties: false
      - name: browser_snapshot
        risk: read
        reads_untrusted_content: true
        description: "現在ページのURL、title、アクセシビリティ表現を取得します"
        input_schema: { type: object, properties: {}, additionalProperties: false }
      - name: browser_screenshot
        risk: read
        reads_untrusted_content: true
        description: "現在画面を元解像度のPNGで取得します"
        input_schema:
          type: object
          properties:
            full_page: { type: boolean }
          additionalProperties: false
      - name: browser_wait_for
        risk: read
        reads_untrusted_content: true
        description: "文字列、selector、または時間を待ちます"
        input_schema:
          type: object
          properties:
            text: { type: string }
            selector: { type: string }
            timeout_ms: { type: number }
          additionalProperties: false
      - name: browser_tabs
        risk: write
        description: "タブを一覧・選択・閉じます"
        input_schema:
          type: object
          properties:
            action: { type: string, enum: [list, select, close] }
            index: { type: number }
          required: [action]
          additionalProperties: false
      - name: browser_click
        risk: write
        reads_untrusted_content: true
        description: "要素をクリックします"
        input_schema:
          type: object
          properties:
            selector: { type: string }
            text: { type: string }
          additionalProperties: false
      - name: browser_type
        risk: write
        reads_untrusted_content: true
        description: "入力欄へ文字列を入力します"
        input_schema:
          type: object
          properties:
            selector: { type: string }
            text_locator: { type: string }
            value: { type: string }
            submit: { type: boolean }
          required: [value]
          additionalProperties: false
      - name: browser_press_key
        risk: write
        reads_untrusted_content: true
        description: "キーを入力します"
        input_schema:
          type: object
          properties:
            key: { type: string }
          required: [key]
          additionalProperties: false
      - name: browser_select_option
        risk: write
        reads_untrusted_content: true
        description: "select要素の値を変更します"
        input_schema:
          type: object
          properties:
            selector: { type: string }
            value: { type: string }
          required: [selector, value]
          additionalProperties: false
      - name: browser_hover
        risk: write
        reads_untrusted_content: true
        description: "要素へホバーします"
        input_schema:
          type: object
          properties:
            selector: { type: string }
            text: { type: string }
          additionalProperties: false
      - name: browser_drag
        risk: write
        reads_untrusted_content: true
        description: "要素間をドラッグします"
        input_schema:
          type: object
          properties:
            source_selector: { type: string }
            target_selector: { type: string }
          required: [source_selector, target_selector]
          additionalProperties: false
      - name: browser_exec_js
        risk: write
        reads_untrusted_content: true
        description: "公開ページを制限付きPlaywrightコードで操作します"
        input_schema:
          type: object
          properties:
            code: { type: string }
            timeout_ms: { type: number }
            expects: { type: string }
          required: [code]
          additionalProperties: false
      - name: computer_action
        risk: external_send
        reads_untrusted_content: true
        description: "許可されたBrowser window内で限定Computer Actionを実行し、Screenshotを返します"
        input_schema:
          type: object
          properties:
            action: { type: string, enum: [click, type, scroll, drag] }
            x: { type: number }
            y: { type: number }
            to_x: { type: number }
            to_y: { type: number }
            value: { type: string }
            delta_x: { type: number }
            delta_y: { type: number }
          required: [action]
          additionalProperties: false

policies: []
